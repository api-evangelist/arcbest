aid: arcbest
name: ArcBest
description: >-
  ArcBest is a multibillion-dollar freight and logistics provider operating ABF Freight (LTL), Panther
  Premium Logistics (expedite), MoLo (truckload brokerage) and U-Pack (moving), with managed
  transportation, warehousing and international forwarding alongside. Its integration surface is
  published on arcb.com in two forms: REST APIs covering rate quote, volume quote, tracking, document
  retrieval, transit times, pickup request and Bill of Lading, whose documentation sits behind a
  customer login; and ANSI X12 EDI, where ArcBest publishes downloadable 204, 210 and 214 mapping
  specifications openly. The one API surface documented publicly is ArcBest Expedite - a Customer API
  and a third-party TMS API, each shipped as a downloadable Swagger-Codegen reference with worked JSON
  examples, live at api.arcb.com with a test environment at test.api.arcb.com.
