  note: >-
    Corrected 2026-09-04 from a derived "freemium / self-serve" reading. ArcBest publishes no plans
    and no prices (plans/arcbest-plans-pricing.yml, plan_count 0); existing customers reach the API
    documentation only after signing in at arcb.com, new customers are routed to
    https://arcb.com/contact-us/connect-with-sales, and every Expedite credential is issued by
    ArcBest support or the ArcBest Expedite team. There is no signup form, no instant key and no
    anonymous try-it console.
