- aid: arcbest:arcbest-expedite-customer-api
  name: ArcBest Expedite Customer API
  description: Quote, book and track ArcBest Expedite (Panther Premium Logistics) time-critical
    freight directly from a shipper's own application. Client-credential authorize call returns a
    bearer token; quotes are submitted, booking requests are queued for an ArcBest operator, booking
    status is polled, and booked shipments are searched by reference number.
  humanURL: https://arcb.com/technology/shippers/API
