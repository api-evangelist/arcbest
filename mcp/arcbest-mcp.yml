note: >-
  ArcBest ships NO MCP server, hosted or local. The tools below are a CANDIDATE list this pipeline
  derived from ArcBest's own documented operations so an agent builder can see the shape of the
  surface. They are not callable as MCP today. Every ArcBest Expedite operation is credential-gated
