description: >-
  ArcBest publishes NO API plans, tiers or price list. API access is not a product you buy - it is an
  entitlement attached to a freight account. Existing customers sign in to arcb.com to reach the API
  documentation and their API ID; new customers are routed to
  https://arcb.com/contact-us/connect-with-sales. Expedite API credentials are issued by ArcBest
  support or the ArcBest Expedite team on request. What is priced is the freight itself, quoted per
  shipment through the API (Charge, ItemizedCharges), not the API calls.
