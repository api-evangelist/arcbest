notes:
  - >-
    Historical caution for this record - the four AE-authored scaffold specifications still in
    openapi/ (arcbest-rates-api, arcbest-shipments-api, arcbest-tracking-api, arcbest-pickups-api,
    each marked x-generated-from: documentation) declare a server of https://api.arcbest.com/v2. That
    host does NOT resolve (DNS NXDOMAIN, probed 2026-09-04). ArcBest's real API host is
    api.arcb.com. Those scaffolds were not repaired to point at the real host, because their paths
    are not ArcBest's published paths - retargeting invented operations at a live host would be worse
    than leaving them visibly marked as authored.
