  detail: >-
    Both published Expedite definitions declare Version v1 and neither base URL carries a version
    segment. There is no version header and no content-negotiated version. Change reaches integrators
    through a re-dated documentation bundle on
    https://arcb.com/technology/shippers/API/expedite-setup-documentation-download - "Customer
    Expedite Quote and Book Instructions and JSON Examples, last updated August 7, 2024" and
    "Expedite TMS Quote and Book Instructions and JSON Examples, last updated August 8, 2025". A
    consumer has no way to pin a version, and no way to be told a breaking change is coming other
    than noticing the date on a download page.
