  - target: $.paths['/booking'].put
    update:
      x-agentic-consequence: physical
      x-apievangelist-note: >-
        Tenders a physical freight movement. No idempotency key and no cancel operation. Poll
        /booking/status with the quote id before re-sending.
  - target: $.paths['/quote'].post
    update:
      x-agentic-consequence: read
      x-apievangelist-note: >-
        Reserves nothing and costs nothing. Errors are returned INSIDE a 200 response in the Errors[]
        array, so a client must read the envelope rather than the HTTP status.
  - target: $.paths['/order/refs/{arcbOrderNo}'].post
    update:
      x-agentic-consequence: write
      x-apievangelist-note: >-
        Keyed on the ArcBest order (pro) number, NOT the expedite order number used for the BOL.
        Correctable by rewriting the references; no window is published.
  - target: $.paths['/order/bol/{expediteOrderNo}'].get
    update:
      x-apievangelist-note: Keyed on the expedite order number, which doubles as the BOL number.
