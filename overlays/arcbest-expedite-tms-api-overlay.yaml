actions:
  - target: $.info
    update:
      x-apievangelist-provenance:
        derived_from: ArcBest's own publicly downloadable Expedite TMS API definition bundle (Swagger-Codegen HTML + instructions PDF)
        bundle: https://arcb.com/sites/default/files/API/ArcBest-Expedite-Digital-API-August-2024.zip
        verbatim_copies:
          - docs/arcbest-expedite-tms-api-definition.html
