      x-apievangelist-agent-readiness:
        idempotency: none
        reversibility: none
        dry_run: sandbox host only (test.api.arcb.com)
        onboarding: credentials issued by the ArcBest Expedite team, not self-serve
      x-apievangelist-push-surface:
        name: Track and Trace
        direction: provider-to-consumer
        catalog: asyncapi/arcbest-track-and-trace-webhooks.yml
        note: >-
          Milestones and location pings are POSTed by ArcBest to an endpoint the integrator hosts and
          registers out of band. It is part of the integration but is not expressible in this
