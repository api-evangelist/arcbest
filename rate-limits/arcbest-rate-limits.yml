specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: ArcBest
providerId: arcbest
created: '2026-05-04'
modified: '2026-09-04'
generated: '2026-09-04'
method: searched
source: >-
  Searched every anonymous ArcBest API document for published limits - the Customer and TMS Expedite
  instruction PDFs and Swagger-Codegen HTML references under docs/,
  https://arcb.com/technology/shippers/API, https://support.arcb.com/en/articles/2851223-api-access -
  and probed api.arcb.com / test.api.arcb.com on 2026-09-04 for rate-limit response headers.
limit_count: 0
limits: []
headers: {}
responseCodes: {}
description: >-
  ArcBest publishes NO rate limits, quotas, burst allowances or throttling policy for either Expedite
  API. Neither instruction PDF, neither Swagger-Codegen reference, nor the API access support article
  mentions a limit, a 429, or a Retry-After. No X-RateLimit-*, RateLimit-* or Retry-After header was
  observed on any anonymous response from api.arcb.com or test.api.arcb.com; those hosts answer 401,
  403, 404 or 405 to unauthenticated calls and carry no rate-limit headers on any of them. An
  authenticated client may see limits this probe cannot reach, but nothing is published.
evidence:
  - url: https://api.arcb.com/expedite/digital/
    status: 401
    note: 'Response headers - Date, Content-Type, Connection, WWW-Authenticate, Content-Length. No rate-limit header. Probed 2026-09-04.'
  - url: https://api.arcb.com/expedite/customer/authorize
    status: 405
    note: No rate-limit header. Probed 2026-09-04.
  - url: https://arcb.com/technology/shippers/API
    status: 200
    note: No limits documented.
note: >-
  This file previously carried five invented per-tier limits (10 rpm free, 100 rpm professional,
  1,000 rpm enterprise, with X-RateLimit-* headers) written by an API Evangelist bulk sweep dated
  2026-05-04 and labelled in its own text as "scaffold values". ArcBest publishes none of that,
  including the headers. It has been replaced with the measured zero.
